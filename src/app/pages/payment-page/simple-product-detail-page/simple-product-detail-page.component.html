<ng-container [formGroup]="form">
  <!-- 
  formArrayName="products"
  esta tabla va a controlar el form array products del formulario principal form
  -->
  <table
    mat-table
    [dataSource]="dataSource"
    class="mat-elevation-z8"
    formArrayName="products"
  >
    <!--- Note that these columns can be defined in any order.
          The actual rendered columns are set as a property on the row definition" -->

    <!-- Position Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Product</th>
      <!-- element :  antes era cada objeto de PRODUCTS, ahora es cada form group del form array -->
      <!-- tiene la misma finalidad que la linea 26 para acceder al valor del control name -->
      <td mat-cell *matCellDef="let element">{{ element.controls.name.value }}</td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Price</th>
      <td mat-cell *matCellDef="let element">{{ element.get('price').value }}</td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef>Quantity</th>
      <!-- solo para mostrar -->
      <!-- <td mat-cell *matCellDef="let element">{{ element.quantity }}</td> -->

      <!-- para mostrar y editar -->
       <!-- este td seria nuestro formulario -->
      <td mat-cell *matCellDef="let element; let i = index" [formGroupName]="i">
        <mat-form-field class="example-form-field">
          <mat-label>Cantidad</mat-label>
          <input matInput type="number" formControlName="quantity" />
        </mat-form-field>
      </td>
    </ng-container>


    <!-- total Column -->
    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef>Total</th>
      <td mat-cell *matCellDef="let element">{{ element.get('total').value }}</td>
    </ng-container>

    <!-- action Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element; let i = index">
        <button mat-icon-button (click)="clickDelete(i)">
            <mat-icon>delete</mat-icon>
        </button>
        <!-- {{ element.get('total').value }} -->
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</ng-container>
